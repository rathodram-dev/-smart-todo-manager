
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Smart To-Do Manager</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <section class="panel edit-panel">
        <h1>Edit Task</h1>

        <form method="POST">

            <label>Task Title</label>
            <input type="text" name="title"
                   value="{{ task.title }}" required maxlength="120">

            <label>Description</label>
            <textarea name="description"
                      maxlength="500">{{ task.description }}</textarea>

            <label>Priority</label>
            <select name="priority">
                {% for p in ['High', 'Medium', 'Low'] %}
                <option value="{{ p }}"
                    {% if task.priority == p %}selected{% endif %}>
                    {{ p }}
                </option>
                {% endfor %}
            </select>

            <label>Due Date</label>
            <input type="date" name="due_date"
                   value="{{ task.due_date or '' }}">

            <button class="primary-btn" type="submit">
                Save Changes
            </button>

            <a href="{{ url_for('home') }}" class="reset-btn">
                Cancel
            </a>

        </form>
    </section>
</div>

</body>
</html>
